[workspace]
resolver = "2"
members = [
    "crates/titan-core",
    "crates/titan-sieve",
    "crates/titan-pool",
    "crates/titan-count",
    "crates/titan-bench",
    "crates/titan-oracle",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
overflow-checks = false
